
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join OffCampus</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .auth-card {
      width: min(410px, 100%);
      padding: 30px;
      background: white;
      border: 1px solid #dbdbdb;
      border-radius: 16px;
    }

    .auth-brand {
      margin-bottom: 8px;
      color: #c13535;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .auth-description {
      margin-bottom: 24px;
      color: #737373;
      line-height: 1.6;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .auth-tabs button {
      flex: 1;
      padding: 11px;
      border: 1px solid #dbdbdb;
      border-radius: 9px;
      background: white;
      color: #555;
      font-weight: 700;
    }

    .auth-tabs button.active {
      border-color: #c13535;
      background: #fff0f0;
      color: #a82c2c;
    }

    .auth-form {
      display: grid;
      gap: 14px;
    }

    .auth-form label {
      display: grid;
      gap: 7px;
      color: #444;
      font-size: 12px;
      font-weight: 650;
    }

    .auth-form input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dbdbdb;
      border-radius: 9px;
      background: #fff;
      color: #262626;
    }

    .auth-submit {
      margin-top: 5px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #c13535;
      color: white;
      font-weight: 750;
    }

    .auth-submit:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .auth-message {
      min-height: 20px;
      margin: 15px 0 0;
      font-size: 12px;
      line-height: 1.6;
    }

    .auth-message.error {
      color: #b42318;
    }

    .auth-message.success {
      color: #277245;
    }

    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
    }

    .auth-footer a {
      color: #c13535;
      font-weight: 700;
    }
  </style>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <a class="brand auth-brand" href="/">OffCampus</a>
    <p class="auth-description">Your space. Your people. Life beyond lectures.</p>

    <div class="auth-tabs">
      <button type="button" class="active" id="show-login">Sign in</button>
      <button type="button" id="show-register">Create account</button>
    </div>

    <form class="auth-form" id="auth-form">
      <label id="username-label" hidden>
        Username
        <input
          id="username"
          name="username"
          type="text"
          minlength="3"
          maxlength="24"
          autocomplete="username"
          pattern="[A-Za-z0-9_]+"
        >
      </label>

      <label>
        Email address
        <input
          id="email"
          name="email"
          type="email"
          maxlength="254"
          autocomplete="email"
          required
        >
      </label>

      <label>
        Password
        <input
          id="password"
          name="password"
          type="password"
          minlength="8"
          maxlength="72"
          autocomplete="current-password"
          required
        >
      </label>

      <button class="auth-submit" id="auth-submit" type="submit">
        Sign in
      </button>
    </form>

    <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>

    <p class="auth-footer">
      <a href="/">← Back to OffCampus</a>
    </p>
  </main>
</body>
</html>
